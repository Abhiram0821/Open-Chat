<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat Room - Text + Voice Messages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 400px;
        }

        .card h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #764ba2;
            color: white;
        }

        .btn-secondary:hover {
            background: #63408b;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
            background: #e0e0e0;
            color: #333;
            width: auto;
            margin: 5px;
        }

        .divider {
            color: #999;
            margin: 20px 0;
            font-weight: bold;
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .room-info {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .participants {
            font-size: 1.1em;
            font-weight: 600;
        }

        .chat-controls {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .chat-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-local {
            background: #667eea;
            color: white;
            align-self: flex-end;
        }

        .message-remote {
            background: #e0e0e0;
            color: #333;
            align-self: flex-start;
        }

        .message-system {
            background: #f0f0f0;
            color: #666;
            align-self: center;
            font-size: 0.9em;
            font-style: italic;
        }

        .timestamp {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .message-form {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .message-form input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .message-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .message-form .btn {
            width: auto;
            padding: 12px 20px;
            margin: 0;
        }

        .voice-message {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-message audio {
            max-width: 220px;
            height: 36px;
        }

        .voice-duration {
            font-size: 0.85em;
            opacity: 0.85;
            white-space: nowrap;
        }

        .recording-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #fff5f5;
            border-top: 2px solid #f56565;
            font-weight: 600;
        }

        .rec-dot {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .card {
                min-width: unset;
                padding: 30px 20px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Socket.io library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <!-- React libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chat Application -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ChatRoom = () => {
            const [roomId, setRoomId] = useState('');
            const [joined, setJoined] = useState(false);
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [participantCount, setParticipantCount] = useState(0);
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            
            const socketRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const micStreamRef = useRef(null);
            const recordingTimerRef = useRef(null);
            const recordingTimeRef = useRef(0);
            const roomIdRef = useRef('');

            useEffect(() => { roomIdRef.current = roomId; }, [roomId]);

            const generateRoomId = () => {
                return 'room-' + Math.random().toString(36).substr(2, 9);
            };

            useEffect(() => {
                const io = window.io;
                if (!io) {
                    console.error('Socket.io not loaded');
                    return;
                }

                socketRef.current = io('https://open-chat-production.up.railway.app', {
                    reconnection: true,
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: 5
                });

                socketRef.current.on('connect', () => {
                    console.log('Connected to server');
                });

                socketRef.current.on('chat-message', (data) => {
                    setMessages(prev => [...prev, { 
                        type: 'text',
                        text: data.message, 
                        sender: 'remote', 
                        timestamp: new Date().toLocaleTimeString() 
                    }]);
                });
                socketRef.current.on('voice-message', (data) => {
                    console.log('Voice message received', data.duration);
                    setMessages(prev => [...prev, {
                        type: 'voice',
                        audioUrl: data.audio,
                        duration: data.duration || 0,
                        sender: 'remote',
                        timestamp: new Date(data.timestamp || Date.now()).toLocaleTimeString()
                    }]);
                });
                socketRef.current.on('participant-count', (count) => {
                    setParticipantCount(count);
                });

                return () => {
                    if (socketRef.current) {
                        socketRef.current.disconnect();
                    }
                    if (micStreamRef.current) {
                        micStreamRef.current.getTracks().forEach(t => t.stop());
                    }
                    if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
                };
            }, []);

            const stopMicTracks = () => {
                if (micStreamRef.current) {
                    micStreamRef.current.getTracks().forEach(t => t.stop());
                    micStreamRef.current = null;
                }
            };

            const formatTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

            const handleJoinRoom = (e) => {
                e.preventDefault();
                if (!roomId.trim()) {
                    alert('Please enter a room ID');
                    return;
                }
                socketRef.current.emit('join-room', { roomId });
                setJoined(true);
                setMessages([{ type: 'text', text: 'You joined the room', sender: 'system', timestamp: new Date().toLocaleTimeString() }]);
            };

            const handleCreateRoom = () => {
                const newRoomId = generateRoomId();
                setRoomId(newRoomId);
                socketRef.current.emit('join-room', { roomId: newRoomId });
                setJoined(true);
                setMessages([{ type: 'text', text: `Room created: ${newRoomId}`, sender: 'system', timestamp: new Date().toLocaleTimeString() }]);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStreamRef.current = stream;
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    recordingTimeRef.current = 0;
                    recorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };
                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: recorder.mimeType || 'audio/webm' });
                        const duration = recordingTimeRef.current;
                        const currentRoom = roomIdRef.current;
                        stopMicTracks();
                        setIsRecording(false);
                        setRecordingTime(0);
                        if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
                        if (blob.size === 0) return;
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const audioUrl = reader.result;
                            console.log('Sending voice message', { room: currentRoom, duration, size: String(audioUrl).length });
                            setMessages(prev => [...prev, { type: 'voice', audioUrl, duration, sender: 'local', timestamp: new Date().toLocaleTimeString() }]);
                            socketRef.current.emit('voice-message', { roomId: currentRoom, audio: audioUrl, duration });
                        };
                        reader.readAsDataURL(blob);
                    };
                    recorder.start();
                    setIsRecording(true);
                    setRecordingTime(0);
                    recordingTimerRef.current = setInterval(() => {
                        recordingTimeRef.current += 1;
                        setRecordingTime(recordingTimeRef.current);
                        if (recordingTimeRef.current >= 120) {
                            if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                                mediaRecorderRef.current.stop();
                            }
                        }
                    }, 1000);
                } catch (err) {
                    alert('Error accessing microphone: ' + err.message);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                } else {
                    stopMicTracks();
                    setIsRecording(false);
                    if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
                }
            };

            const cancelRecording = () => {
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.onstop = () => {
                        stopMicTracks();
                        setIsRecording(false);
                        setRecordingTime(0);
                        recordingTimeRef.current = 0;
                        if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
                    };
                    mediaRecorderRef.current.stop();
                } else {
                    stopMicTracks();
                    setIsRecording(false);
                    setRecordingTime(0);
                }
                audioChunksRef.current = [];
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputMessage.trim()) return;

                setMessages(prev => [...prev, { 
                    type: 'text',
                    text: inputMessage, 
                    sender: 'local', 
                    timestamp: new Date().toLocaleTimeString() 
                }]);
                socketRef.current.emit('chat-message', {
                    roomId: roomId,
                    message: inputMessage
                });
                setInputMessage('');
            };

            const copyRoomId = () => {
                navigator.clipboard.writeText(roomId);
                alert('Room ID copied to clipboard!');
            };

            if (!joined) {
                return (
                    <div className="container login-container">
                        <div className="card">
                            <h1>💬 Anonymous Chat Room</h1>
                            <p className="subtitle">Connect with others anonymously</p>

                            <div className="form-group">
                                <input
                                    type="text"
                                    placeholder="Enter Room ID to join"
                                    value={roomId}
                                    onChange={(e) => setRoomId(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleJoinRoom(e)}
                                />
                                <button onClick={handleJoinRoom} className="btn btn-primary">
                                    Join Room
                                </button>
                            </div>

                            <div className="divider">OR</div>

                            <button onClick={handleCreateRoom} className="btn btn-secondary">
                                Create New Room
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container chat-container">
                    <div className="chat-header">
                        <div>
                            <h1>Chat Room</h1>
                            <p className="room-info">ID: <strong>{roomId}</strong></p>
                        </div>
                        <div className="participants">👥 {participantCount} participants</div>
                    </div>

                    <div className="chat-controls">
                        <button 
                            onClick={copyRoomId} 
                            className="btn btn-small"
                            title="Copy room ID to share with others"
                        >
                            📋 Copy Room ID
                        </button>
                    </div>

                    <div className="chat-content">
                        <div className="messages">
                            {messages.map((msg, idx) => (
                                <div 
                                    key={idx} 
                                    className={`message message-${msg.sender}`}
                                >
                                    <span className="timestamp">{msg.timestamp}</span>
                                    {msg.type === 'voice' ? (
                                        <span className="voice-message">
                                            <span>🎤</span>
                                            <audio controls src={msg.audioUrl} preload="metadata" />
                                            <span className="voice-duration">{formatTime(msg.duration || 0)}</span>
                                        </span>
                                    ) : (
                                        <span>{msg.text}</span>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {isRecording && (
                        <div className="recording-bar">
                            <span className="rec-dot">🔴</span>
                            <span>Recording... {formatTime(recordingTime)}</span>
                            <button onClick={stopRecording} className="btn btn-small">✔ Send</button>
                            <button onClick={cancelRecording} className="btn btn-small">✖ Cancel</button>
                        </div>
                    )}

                    <form onSubmit={handleSendMessage} className="message-form">
                        <input
                            type="text"
                            placeholder="Type a message..."
                            value={inputMessage}
                            onChange={(e) => setInputMessage(e.target.value)}
                        />
                        {!isRecording ? (
                            <button type="button" onClick={startRecording} className="btn btn-small" title="Record voice message">🎤</button>
                        ) : (
                            <button type="button" onClick={stopRecording} className="btn btn-small" title="Stop and send">⏹</button>
                        )}
                        <button type="submit" className="btn btn-primary">Send</button>
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChatRoom />);
    </script>
</body>
</html>
