version: '3.8'

services:
  # Node.js Backend Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonymous-chat-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend (if serving from the same stack)
  frontend:
    image: nginx:alpine
    container_name: anonymous-chat-frontend
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - chat-network
    restart: unless-stopped

networks:
  chat-network:
    driver: bridge
